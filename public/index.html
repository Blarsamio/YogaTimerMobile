<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="manifest" href="/manifest.json" />
    <title>Yoga Timer — Yin Yoga Session &amp; Pose Practice</title>

    <!-- SEO -->
    <meta name="description" content="A mindful yin yoga timer for long-hold pose sequences. Choose from curated sessions or build your own custom practice with gentle transition sounds." />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yoga Timer — Yin Yoga Session &amp; Pose Practice" />
    <meta property="og:description" content="A mindful yin yoga timer for long-hold pose sequences. Choose from curated sessions or build your own custom practice." />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Yoga Timer — Yin Yoga Session &amp; Pose Practice" />
    <meta name="twitter:description" content="A mindful yin yoga timer for long-hold pose sequences. Choose from curated sessions or build your own custom practice." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Visually hidden — accessible to screen readers and SEO */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Skip link — visually hidden until focused */
      .skip-link {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
        color: #F5F1ED;
        background: #1C1C1C;
        text-decoration: none;
      }
      .skip-link:focus {
        position: fixed;
        top: 16px;
        left: 16px;
        width: auto;
        height: auto;
        padding: 8px 16px;
        font-size: 14px;
        border-radius: 8px;
        z-index: 9999;
        outline: 2px solid #A99985;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <!-- Skip to main content (accessibility) -->
    <a href="#root" class="skip-link">Skip to main content</a>

    <!-- SEO-visible page heading for crawlers (app renders content via JS) -->
    <h1 class="visually-hidden">Yoga Timer — Yin Yoga Session &amp; Pose Practice</h1>

    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      <p>Yoga Timer requires JavaScript to run. Please enable JavaScript in your browser settings to use the app.</p>
    </noscript>

    <!-- The root element for your Expo app. -->
    <div id="root" role="main"></div>
  </body>
</html>
